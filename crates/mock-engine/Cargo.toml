[package]
name = "mock-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
data-generator = { version = "0.1.0", path = "../data-generator" }
jsonschema = { version = "0.63.0", default-features = false }
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
uuid = { version = "1.26.1", features = ["v4"] }
workbench-core = { version = "0.1.0", path = "../workbench-core" }
workbench-domain = { version = "0.1.0", path = "../workbench-domain" }

[lints]
workspace = true

[dev-dependencies]
uuid = "1.26.1"
