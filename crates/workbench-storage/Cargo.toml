[package]
name = "workbench-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
workbench-core = { version = "0.1.0", path = "../workbench-core" }
workbench-domain = { version = "0.1.0", path = "../workbench-domain" }

[lints]
workspace = true

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
mock-runtime = { path = "../mock-runtime" }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.26.1", features = ["v4"] }
