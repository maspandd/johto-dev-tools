[package]
name = "workbench-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
data-generator = { version = "0.1.0", path = "../data-generator" }
getrandom = "0.4.3"
mock-engine = { version = "0.1.0", path = "../mock-engine" }
mock-runtime = { version = "0.1.0", path = "../mock-runtime" }
openapi-engine = { version = "0.1.0", path = "../openapi-engine" }
project-archive = { version = "0.1.0", path = "../project-archive" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
workbench-core = { version = "0.1.0", path = "../workbench-core" }
workbench-domain = { version = "0.1.0", path = "../workbench-domain" }
workbench-storage = { version = "0.1.0", path = "../workbench-storage" }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tower = { version = "0.5.3", features = ["util"] }

[[bin]]
name = "workbench-server"
path = "src/main.rs"
